<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер изображений</title>
</head>
<body>
    <div class="app">
        <!-- Верхняя секция с формой -->
        <div class="form-section">
            <h1>Галерея изображений</h1>

            <div class="form-row">
                <div class="form-label">Название</div>
                <input type="text" id="imageName" class="input-field" placeholder="Введите название">
            </div>

            <div class="form-row">
                <div class="form-label">Ссылка на изображение</div>
                <input type="text" id="imageUrl" class="input-field" placeholder="Введите URL">
            </div>

            <div class="button-container">
                <button id="addBtn" class="btn-add">Добавить</button>
            </div>

            <div id="errorMsg" class="error-message hidden">Неверный URL изображения</div>
        </div>
    </div>
    <!-- Отдельная секция для галереи -->
    <div class="gallery-section">
        <div id="gallery" class="gallery"></div>
    </div>

</body>
</html>
